name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ──────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linter
        run: pip install flake8==7.1.1

      - name: Run flake8
        run: flake8 src/ main.py

  # ──────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q --tb=short
        env:
          DB_PATH: ":memory:"

      - name: Offline demo and startup/delivery regressions
        run: |
          test ! -f .env
          python main.py --demo
          pytest tests/integration/test_offline_demo.py tests/integration/test_runtime_pipeline.py tests/integration/test_diagnostics.py tests/unit/test_runtime_settings.py tests/unit/test_telegram_delivery.py tests/unit/test_acquisition_errors.py -q

      - name: Check coverage threshold (Python 3.12 only)
        if: matrix.python-version == '3.12'
        # Baseline post-FOSS (2026-08-24): la rimozione del layer licensing
        # ha eliminato i test che coprivano quella area (43% attuale).
        # Obiettivo dichiarato: risalire al 70% coprendo reasoning e fetch.
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=40
        env:
          DB_PATH: ":memory:"

  # ──────────────────────────────────────────
  # Docker build check
  # ──────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sentrycage:ci .

      - name: Credential-free demo with network disabled
        run: docker run --rm --network none sentrycage:ci python main.py --demo

      - name: SQLite volume survives container recreation
        run: |
          docker volume create sentrycage-ci-data
          docker run --rm --network none -v sentrycage-ci-data:/app/data sentrycage:ci python -c "from src.database.sqlite import init_db, set_config; init_db(); set_config('persistence_probe', 'ci')"
          docker run --rm --network none -v sentrycage-ci-data:/app/data sentrycage:ci python -c "from src.database.sqlite import get_config; assert get_config('persistence_probe') == 'ci'"
          docker volume rm sentrycage-ci-data

  # ──────────────────────────────────────────
  # License CLI check
  # ──────────────────────────────────────────
  license-cli:
    name: License CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test license CLI status command
        run: python -m src.config status
        env:
          DB_PATH: /tmp/ci_license_test.db
