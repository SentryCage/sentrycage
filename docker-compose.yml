services:
  sentrycage:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/whale_tracker.db
    volumes:
      - sentrycage-data:/app/data
    networks:
      - sentrycage-net

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - sentrycage-net

  ollama-init:
    image: ollama/ollama:latest
    profiles: [ai]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    networks:
      - sentrycage-net
    entrypoint: [sh, -c]
    command:
      - |
        timeout 600 sh -c '
          attempts=0
          until ollama list >/dev/null 2>&1; do
            attempts=$$((attempts + 1))
            if [ "$$attempts" -ge 60 ]; then
              echo "Ollama unavailable after readiness deadline" >&2
              exit 1
            fi
            sleep 2
          done
          ollama pull "$$OLLAMA_MODEL"
        '
    restart: "no"

volumes:
  sentrycage-data:
  ollama-data:

networks:
  sentrycage-net:
